name: go-binaries

# 可运行二进制构建/发布：
#   - PR / push main → 测试 + 五平台编译验证（产物仅存 artifact，不发布）
#   - push v* tag    → 同上 + 打包上传到 GitHub Release（zip/tar.gz + checksums）
# 固化的发布纪律（曾两次人祸，见仓库 HANDOFF）：-s -w 剥离、二进制版本串 == 源码
# appVersion、tag 版本 == 源码版本（-ci 后缀的测试 tag 豁免，用于演练发布线）。
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "go.mod"
      - "go.sum"
      - "cmd/**"
      - "internal/**"
      - "config.example.json"
      - ".github/workflows/go-binaries.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # ubuntu runner 自带 node → panel 包的 JS 运行时冒烟测试（TestAppJSTopLevelSmoke）会真实执行
      - run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: windows, goarch: amd64, ext: .zip }
          - { goos: linux, goarch: amd64, ext: .tar.gz }
          - { goos: linux, goarch: arm64, ext: .tar.gz }
          - { goos: darwin, goarch: amd64, ext: .tar.gz }
          - { goos: darwin, goarch: arm64, ext: .tar.gz }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: 取源码版本号
        id: ver
        run: echo "v=$(grep -oP 'appVersion = "\K[^"]+' cmd/server/main.go)" >> "$GITHUB_OUTPUT"

      - name: 构建（剥离符号，对齐本地发布口径）
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -ldflags "-s -w" -o "wb2api${{ matrix.goos == 'windows' && '.exe' || '' }}" ./cmd/server

      # 版本串断言：二进制必须含源码 appVersion（防交叉编译矩阵里编错树/漏 ldflags）
      - name: 断言二进制版本串
        run: |
          BIN="wb2api${{ matrix.goos == 'windows' && '.exe' || '' }}"
          if ! grep -qa "${{ steps.ver.outputs.v }}" "$BIN"; then
            echo "::error::binary missing version string ${{ steps.ver.outputs.v }}"
            exit 1
          fi
          echo "version assert OK: ${{ steps.ver.outputs.v }}"

      - name: 打包（windows=zip 三件套，其余=tar.gz）
        run: |
          V="${{ steps.ver.outputs.v }}"
          V="${V%-panel}"   # 文件名不带 -panel 后缀（wb2api-panel-v1.2.3-... 既有惯例）
          case "${{ matrix.goos }}" in
            windows)
              NAME="wb2api-panel-v${V}-windows-amd64.zip"
              zip -q "$NAME" wb2api.exe config.example.json README.md
              ;;
            *)
              NAME="wb2api-panel-v${V}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
              tar czf "$NAME" wb2api config.example.json README.md
              ;;
          esac
          echo "name=$NAME" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.name }}
          path: ${{ env.name }}
          retention-days: 7

  # tag 专用：构建固定命名的一键安装包（内容含主程序与可选 CLI 工具）。
  linux-installer:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { asset: amd64, goarch: amd64, goarm: "" }
          - { asset: arm64, goarch: arm64, goarm: "" }
          - { asset: armv7, goarch: arm, goarm: "7" }
          - { asset: armv6, goarch: arm, goarm: "6" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: 构建 Linux 一键安装包
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: 0
        run: |
          set -euo pipefail
          ASSET="${{ matrix.asset }}"
          VERSION="${GITHUB_REF_NAME#v}"
          BUNDLE="bundle-linux-${ASSET}"
          mkdir -p "$BUNDLE" dist
          go build -trimpath -ldflags "-s -w -X main.appVersion=${VERSION}" -o "$BUNDLE/wb2api" ./cmd/server
          go build -trimpath -ldflags "-s -w" -o "$BUNDLE/login" ./cmd/login
          go build -trimpath -ldflags "-s -w" -o "$BUNDLE/signin_bin" ./cmd/signin
          go build -trimpath -ldflags "-s -w" -o "$BUNDLE/credit" ./cmd/credit
          cp login.sh signin.sh credit.sh "$BUNDLE/"
          printf '%s\n' "$VERSION" > "$BUNDLE/VERSION"
          tar -C "$BUNDLE" -czf "dist/wb2api_linux_${ASSET}.tar.gz" .
          cd dist
          sha256sum "wb2api_linux_${ASSET}.tar.gz" > "wb2api_linux_${ASSET}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundle-${{ matrix.asset }}
          path: dist/*
          retention-days: 7

  publish:
    needs: [build, linux-installer]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 取历史 tag 算 compare 链接
      - name: tag 与源码版本一致性断言
        run: |
          SRC=$(grep -oP 'appVersion = "\K[^"]+' cmd/server/main.go)
          SRC="${SRC%-panel}"   # appVersion 带 -panel 后缀，比对前剥掉
          TAG="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_NAME" != *-ci ]]; then
            if [[ "$TAG" != "$SRC" ]]; then
              echo "::error::tag $GITHUB_REF_NAME 与源码 appVersion=$SRC 不一致（先提交版本号再打 tag）"
              exit 1
            fi
          else
            echo "演练 tag（-ci 后缀）跳过一致性断言：tag=$TAG src=$SRC"
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: |
          cd dist
          cp ../install.sh install.sh
          for f in wb2api_linux_*.tar.gz; do
            sha256sum "$f" > "$f.sha256"
          done
          sha256sum *.zip *.tar.gz install.sh > checksums.txt
          ls -la
      - name: 上一版 tag（compare 链接用）
        id: prev
        run: |
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          echo "prev=${PREV}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}-panel
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            CI 自动构建发布（Linux 一键安装包 + 五平台二进制 + checksums）。

            Linux 云端一键安装：
            ```bash
            curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/install.sh | sudo bash
            ```

            完整变更：https://github.com/${{ github.repository }}/compare/${{ steps.prev.outputs.prev }}...${{ github.ref_name }}
          files: dist/*

      - name: 验证云端安装脚本
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          PID=""
          trap 'if [ -n "$PID" ]; then sudo kill "$PID" 2>/dev/null || true; fi; sudo rm -rf "$TMP"' EXIT
          sudo bash dist/install.sh \
            --dir "${TMP}/app" \
            --listen 127.0.0.1:17863 \
            --api-key smoke-test \
            --user root \
            --no-service \
            --version "$GITHUB_REF_NAME"
          sudo "${TMP}/app/wb2api" -config "${TMP}/app/config.json" > "${TMP}/app.log" 2>&1 &
          PID=$!
          ok=0
          for i in $(seq 1 20); do
            CODE="$(curl -s -o /dev/null -w '%{http_code}' --max-time 2 http://127.0.0.1:17863/healthz || true)"
            case "$CODE" in
              200|503) ok=1; break ;;
            esac
            sleep 1
          done
          if [ "$ok" != "1" ]; then
            echo "installer smoke test failed (HTTP ${CODE:-none})"
            cat "${TMP}/app.log"
            exit 1
          fi
          echo "installer smoke test OK (HTTP $CODE)"
